# Builds the Android app on GitHub and publishes the APK on the repo's Releases page.
#
# Runs on every push to main (except README/docs) and on demand:
# Actions tab > Build APK > Run workflow.
#
# Signing: with no secrets set, the APK is signed with the app's own key in signing/, so each new build
# installs over the one before and keeps your settings. To sign with your release key instead,
# add four repository secrets (Settings > Secrets and variables > Actions):
#   KEYSTORE_BASE64    the release keystore (.p12), base64 on one line
#   KEYSTORE_PASSWORD  its store password
#   KEY_ALIAS          the key alias
#   KEY_PASSWORD       the key password
# Android only installs an update signed with the same key as the app on the radio, so switching keys later
# means uninstalling once.
name: Build APK

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

permissions:
  contents: write   # lets the job publish a release with the APK attached

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Set up the release key (only if the secrets are set)
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            mkdir -p keystore
            printf '%s' "$KEYSTORE_BASE64" | tr -d ' \r\n' | base64 -d > keystore/release.p12
            {
              printf 'storeFile=release.p12\n'
              printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD"
              printf 'keyAlias=%s\n' "$KEY_ALIAS"
              printf 'keyPassword=%s\n' "$KEY_PASSWORD"
            } > keystore/keystore.properties
            echo "key=your release key" >> "$GITHUB_OUTPUT"
          else
            echo "key=the app's own key (signing/)" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the APK
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease 2>&1 | tee build.log
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      - name: Point out what broke the build
        # Puts the compiler's error lines on the run's summary page, so they're readable without the full log.
        if: failure()
        run: |
          [ -f build.log ] || exit 0
          MSG=$(grep -E '^e: |^ERROR|error:|What went wrong' -A2 build.log | head -80 | sed 's/%/%25/g; s/\r//g' | sed ':a;N;$!ba;s/\n/%0A/g')
          [ -n "$MSG" ] && echo "::error title=Build failed::$MSG" || true

      - name: Name the APK
        id: meta
        run: |
          VERSION=$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          NAME="Jumpstart-${VERSION}.apk"
          cp "$APK_PATH" "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Show the signing certificate
        continue-on-error: true
        run: |
          APKSIGNER=$(ls -d "${ANDROID_HOME:-/usr/local/lib/android/sdk}"/build-tools/*/apksigner | sort -V | tail -n1)
          {
            echo "### ${{ steps.meta.outputs.name }}"
            echo "Signed with ${{ steps.signing.outputs.key }}."
            echo '```'
            "$APKSIGNER" verify --verbose --print-certs "${{ steps.meta.outputs.name }}" 2>&1 | grep -E 'Verifies|Verified using|certificate SHA-256|Number of signers' || true
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Keep a copy with the workflow run
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.name }}
          path: ${{ steps.meta.outputs.name }}
          if-no-files-found: error

      - name: Publish a release with the APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          # "Re-run failed jobs" keeps the build number, so don't trip over this run's own release.
          if gh release view "$TAG" >/dev/null 2>&1; then
            if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = "true" ]; then
              gh release delete "$TAG" --yes --cleanup-tag
            else
              echo "Release $TAG already exists (re-run); keeping it."
              exit 0
            fi
          fi
          gh release create "$TAG" "${{ steps.meta.outputs.name }}" \
            --target "$GITHUB_SHA" \
            --title "Jumpstart ${{ steps.meta.outputs.version }} (build ${{ github.run_number }})" \
            --notes "Built from commit ${GITHUB_SHA::7}, signed with ${{ steps.signing.outputs.key }}. Download the APK below onto the radio (or a USB stick) and open it to install or update."
